unbind C-b
set -g prefix C-a # C-Space
bind C-a send-prefix

set -g detach-on-destroy off
set -g extended-keys on

set -s escape-time 10
set -g display-time 2000
set -g history-limit 30000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on

set -sa terminal-features ",*:RGB"

set -g status-keys emacs

#―――――――#

bind -n M-{ copy-mode

# set -g mode-keys vi
bind -T copy-mode-vi Y send -X copy-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# bind -T copy-mode-vi r send-keys -X rectangle-toggle

unbind -T copy-mode-vi MouseDragEnd1Pane

#―――――――#

bind r source-file ~/.tmux.conf \; display "Config reloaded"

unbind %
unbind \"
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
bind \\ split-window -h
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-H previous-window
bind -n M-L next-window

bind "n" new-window -c "#{pane_current_path}"
bind "c" new-window

bind -n M-N kill-pane
# kill-pane -a

bind -n M-O resize-pane -Z # -r

bind -n M-K display-popup -E '
current=$(tmux display-message -p "#S")
target=$(tmux list-sessions -F "#{session_name}" | grep -vx "$current" | fzf --reverse --height 80%)
[ -n "$target" ] && tmux switch-client -t "$target"
'

bind -n M-S if -F '#{s/off//:status}' 'set status off' 'set status on'
bind -n M-: command-prompt

bind -n M-J switch-client -l

bind -n M-i if-shell '[ "$(tmux display-message -p -F "#{session_name}")" = "scratch" ]' 'detach-client' 'display-popup -w 99% -h 99% -E "tmux new -A -s scratch -c ~/tmp"'

bind -n M-) if -F '#{==:#{session_name},atomic}' 'switch-client -l' 'switch-client -t atomic'
bind -n M-( if -F '#{==:#{session_name},dotfiles}' 'switch-client -l' 'switch-client -t dotfiles'
bind -n M-* if -F '#{==:#{session_name},tmp}' 'switch-client -l' 'switch-client -t tmp'

bind C-h display-popup -d '#{pane_current_path}' -w97% -h97% -E "lazygit"

bind -n M-\" setw synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

bind C-l send-keys C-l

bind-key "C-k" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

#―――――――#

color_bg="#2e323b"
color_gray="#808080"
color_orange="#ff6961"
color_purple_gray="#a7a6ba"
color_white_smoke="#989898"

set -g pane-active-border-style fg=red
set -g pane-border-style "fg=color239"
set -g popup-border-lines single
set-option -g popup-border-style "fg=#3e4451,bg=#282c34"

set -g message-style bg=$color_purple_gray,fg=$color_bg
set -g pane-border-indicators both
set -g mode-style "bg=#3e4452"

# set -g status-left "#[fg=$color_white_smoke]$session_icon #S #{@session-label}"
set -g status-right ""

set -g window-status-format         "#[fg=$color_gray,italics]#I:#[noitalics]#W#F"
set -g window-status-current-format "#[fg=$color_orange,italics]#I:#[fg=$color_purple_gray,noitalics,bold]#W#F"

set -g status-position top
set -g status-justify absolute-centre

set -g status-style bg=default
set -g window-status-activity-style "bg=default"
set -g window-status-separator " "

set -g status-left-length 90

#―――――――#

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'
